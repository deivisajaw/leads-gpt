<ng-container *ngIf="!isRegistering && !showCinematic">
  
  <div id="progress">
    <div class="fill" [style.width.%]="(currentStep + 1) / questions.length * 100"></div>
  </div>

  <div id="stage">

    <div id="particles-js"></div>

    <div class="step active" *ngIf="questions.length > 0 && questions[currentStep]">
      
      <div class="wizard-absolute-left-zone">
        <div id="topbar">
          <img src="/images/ajaw-logo.png" alt="Ajaw Logo" class="logo" />
        </div>
        
        <button class="back wizard-back-pill" (click)="previousStep()" *ngIf="currentStep > 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Atrás
        </button>
      </div>

      <div class="wizard-absolute-right-zone">
        <button class="skip" (click)="skipStep()">Saltar</button>
        <div class="wizard-custom-counter">
          Paso {{ currentStep + 1 }} de {{ questions.length }}
        </div>
      </div>

      <div class="q-wrap">
        
        <div class="q-eyebrow">
          <span class="dot"></span>
          <span class="category-text-blue">{{ questions[currentStep].category || 'Registro' }}</span>
        </div>
        
        <h1 class="q-title">{{ questions[currentStep].description }}</h1>
        
        <p class="q-sub" *ngIf="questions[currentStep].subtitle">{{ questions[currentStep].subtitle }}</p>
        
        <div class="options cols-1" [ngSwitch]="questions[currentStep].questionType">
          
          <ng-container *ngSwitchCase="'SINGLE_SELECT'">
            <button *ngFor="let option of questions[currentStep].options" 
                    class="opt"
                    [class.sel]="answers[questions[currentStep].id].selectedOption === option.id"
                    (click)="selectOption(questions[currentStep].id, option.id)">
              <span class="ic" *ngIf="option.iconClass"><i [ngClass]="option.iconClass"></i></span>
              <span class="lbl">{{ option.description }}</span>
              <span class="chev">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </span>
            </button>
          </ng-container>

          <ng-container *ngSwitchCase="'MULTI_SELECT'">
            <button *ngFor="let option of questions[currentStep].options" 
                    class="opt"
                    [class.sel]="isOptionSelected(questions[currentStep].id, option.id)"
                    (click)="selectOption(questions[currentStep].id, option.id)">
              <span class="ic" *ngIf="option.iconClass"><i [ngClass]="option.iconClass"></i></span>
              <span class="lbl">{{ option.description }}</span>
            </button>
            <button class="opt wizard-next-btn" (click)="handleAutomaticAdvance()" [disabled]="!isCurrentStepValid()">Continuar</button>
          </ng-container>

          <div *ngSwitchCase="'TEXT'" class="wizard-input-vertical-wrap">
            <input type="text" class="opt text-field-input" placeholder="{{ 'ONBOARDING_WIZARD.TEXT_PLACEHOLDER' | translate }}" [(ngModel)]="answers[questions[currentStep].id].answerText" (ngModelChange)="ensureAnswerObject(questions[currentStep].id)">
            <button class="opt wizard-next-btn" (click)="handleAutomaticAdvance()" [disabled]="!isCurrentStepValid()">Continuar</button>
          </div>

          <ng-container *ngSwitchCase="'BOOLEAN'">
            <button class="opt" [class.sel]="answers[questions[currentStep].id].answerText === 'true'" (click)="selectBooleanOption(questions[currentStep].id, 'true')">
              <span class="lbl">{{ 'COMMON.YES' | translate }}</span>
            </button>
            <button class="opt" [class.sel]="answers[questions[currentStep].id].answerText === 'false'" (click)="selectBooleanOption(questions[currentStep].id, 'false')">
              <span class="lbl">{{ 'COMMON.NO' | translate }}</span>
            </button>
          </ng-container>

        </div>
      </div>

    </div>

  </div>
</ng-container>

<div id="stage" class="wizard-loading-overlay" *ngIf="isRegistering">
  <div class="step active" style="display: flex; align-items: center; justify-content: center;">
    <div class="loader-inner" style="text-align: center;">
      <div class="spinner" style="width:54px; height:54px; margin:0 auto 26px; position:relative;">
        <svg viewBox="0 0 38 38" style="width:100%; height:100%; animation:spin 1s linear infinite;" stroke="url(#sg)">
          <g fill="none" fill-rule="evenodd"><g transform="translate(1 1)" stroke-width="3"><circle stroke-opacity=".1" cx="18" cy="18" r="18"/><path d="M36 18c0-9.94-8.06-18-18-18"/></g></g>
          <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7871FB"/><stop offset="1" stop-color="#251F95"/></linearGradient></defs>
        </svg>
      </div>
      <div class="loader-title" style="font-size:22px; font-weight:600; letter-spacing:-.01em; color: var(--ink);">Preparando tu cuenta…</div>
      <div class="loader-sub" style="font-size:15px; color:var(--grey); margin-top:8px;">Configurando tu espacio de trabajo</div>
    </div>
  </div>
</div>

<div id="cinematic" class="show" *ngIf="showCinematic" style="position:fixed; inset:0; z-index:9999999; background:#05040f; display:flex; align-items:center; justify-content:center; overflow:hidden;">
  <video #cineVideo class="cine-video show" muted playsinline style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:4;">
    <source src="videos/earth-dive4k.mp4" type="video/mp4">
  </video>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
