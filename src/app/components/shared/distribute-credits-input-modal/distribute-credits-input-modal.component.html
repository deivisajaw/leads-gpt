<div class="custom-modal-overlay" *ngIf="showModal" (click)="onClose()">
  <div class="custom-modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ 'ADMIN_USERS.DISTRIBUTE_CREDITS_MODAL_TITLE' | translate }}</h2>
      <button class="close-button" (click)="onClose()">&times;</button>
    </div>
    <div class="modal-body">
      <p>{{ 'ADMIN_USERS.DISTRIBUTE_CREDITS_MODAL_MESSAGE' | translate }}</p>
      <div class="form-group">
        <label for="creditsToDistribute">{{ 'ADMIN_USERS.CREDITS_TO_DISTRIBUTE_LABEL' | translate }}</label>
        <input type="number" id="creditsToDistribute" [(ngModel)]="creditsToDistribute" class="form-control" [max]="maxCredits" min="0">
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div *ngIf="isLoading" class="loading-indicator">
        <p>{{ 'COMMON.PROCESSING' | translate }}</p>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="onClose()" [disabled]="isLoading">{{ 'ADMIN_USERS.DISTRIBUTE_CREDITS_MODAL_CANCEL' | translate }}</button>
      <button class="btn btn-primary" (click)="onDistribute()" [disabled]="isLoading || creditsToDistribute <= 0 || creditsToDistribute > maxCredits">{{ 'ADMIN_USERS.DISTRIBUTE_CREDITS_MODAL_DISTRIBUTE_BTN' | translate }}</button>
    </div>
  </div>
</div>
