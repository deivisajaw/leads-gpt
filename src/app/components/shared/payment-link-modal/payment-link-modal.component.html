<div class="custom-modal-overlay" (click)="closeModal()">
  <div class="custom-modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ 'PAYMENT_MODAL.TITLE' | translate }}</h2>
      <button class="close-button" (click)="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p class="message-info"><i class="fas fa-check-circle icon-left"></i> {{ 'PAYMENT_MODAL.MESSAGE_1' | translate }}</p>
      <a [href]="paymentUrl" target="_blank" (click)="openPaymentLink()">{{ paymentUrl }}</a>

      <p class="message-info"><i class="fas fa-envelope icon-left"></i> {{ 'PAYMENT_MODAL.MESSAGE_2' | translate }}</p>
      <p class="message-warning"><i class="fas fa-exclamation-triangle icon-left"></i> {{ 'PAYMENT_MODAL.MESSAGE_3' | translate }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()">{{ 'PAYMENT_MODAL.CLOSE' | translate }}</button>
    </div>
  </div>
</div>
