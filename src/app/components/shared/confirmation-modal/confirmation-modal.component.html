<div class="custom-modal-overlay" *ngIf="showModal" (click)="onCancel()">
  <div class="custom-modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ title | translate }}</h2>
      <button class="close-button" (click)="onCancel()">&times;</button>
    </div>
    <div class="modal-body">
      <p>{{ message }}</p>
    </div>

    <div *ngIf="errorMessage" class="modal-error">
      {{ errorMessage }}
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ 'MODALS.CANCEL' | translate }}</button>
      <button type="button" class="btn btn-primary" (click)="onConfirm()" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ 'MODALS.CONFIRM' | translate }}</span>
        <span *ngIf="isLoading">{{ 'MODALS.LOADING' | translate }}...</span>
      </button>
    </div>
  </div>
</div>
