<div class="upgrade-container">
  <div class="upgrade-card">
    <div class="upgrade-header">
      <div class="icon-container">
        <i class="fas fa-rocket"></i>
      </div>
      <h1 class="upgrade-title">{{ "UPGRADE.TITLE" | translate }}</h1>
    </div>
    <p class="upgrade-description">{{ "UPGRADE.DESCRIPTION" | translate }}</p>
    <div class="features-list">
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>{{ "UPGRADE.FEATURE_SEQUENCES" | translate }}</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>{{ "UPGRADE.FEATURE_EMAILS" | translate }}</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>{{ "UPGRADE.FEATURE_CALLS" | translate }}</span>
      </div>
    </div>
    <button class="btn-primary upgrade-button" routerLink="/plans">
      <i class="fas fa-arrow-up"></i>
      {{ "UPGRADE.VIEW_PLANS" | translate }}
    </button>
  </div>
</div>
